<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Number Plate Button</title>
    <style>
        :root {
            --plate-yellow: #FFD700;
            --plate-dark-yellow: #E5C100;
            --plate-border: #333;
            --bolt-color: #555;
        }
        
        body {
            display: flex;
            /* justify-content: center; */
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            font-family: 'Arial', sans-serif;
            background-image: radial-gradient(at top, #a1c4fd 20%, #c2e9fb 100%);        }
        
            .number-plate-button,.number-plate-button2,.number-plate-button3 {
                position: relative;
                margin-left: 50px;
                width: 420px;
                height: 130px;
                background: linear-gradient(145deg, var(--plate-yellow) 0%, var(--plate-dark-yellow) 100%);
                border-radius: 12px;
                border: 5px solid var(--plate-border);
                box-shadow: 
                    0 10px 30px rgba(0,0,0,0.3),
                    inset 0 -3px 10px rgba(0,0,0,0.2);
                transition: all 0.3s ease;
                cursor: pointer;
                overflow: hidden;
                
                padding: 0;
                color: black;
                font-weight: bold;
            
            }
            
        
        /* 3D Edge Effect */
        .number-plate-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 15px;
            background: linear-gradient(to bottom, 
                rgba(255,215,0,0.8) 0%, 
                rgba(229,193,0,0.6) 50%, 
                rgba(179,149,0,0.4) 100%);
            transform-origin: top;
            transform: rotateX(40deg);
            border-radius: 8px 8px 0 0;
        }
        
        /* Reflective Strip */
        .number-plate-button::after {
            content: '';
            position: absolute;
            top: 20%;
            left: -50%;
            width: 200%;
            height: 30%;
            background: linear-gradient(
                to right,
                rgba(255,255,255,0) 0%,
                rgba(255,255,255,0.4) 50%,
                rgba(255,255,255,0) 100%
            );
            transform: rotate(15deg);
            pointer-events: none;
        }
        
        .plate-number {
            font-family: 'Arial Black', sans-serif;
            font-size: 42px;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            margin: 0;
            z-index: 2;
        }
        
        .plate-label {
            font-size: 14px;
            margin-top: 5px;
            z-index: 2;
        }
        
        .bolt {
            position: absolute;
            width: 12px;
            height: 12px;
            background: var(--bolt-color);
            border-radius: 50%;
            border: 2px solid #333;
            box-shadow: 
                inset 1px 1px 3px rgba(255,255,255,0.2),
                0 1px 2px rgba(0,0,0,0.4);
            z-index: 3;
        }
        
        .bolt::after {
            content: '+';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(151, 140, 140, 0.7);
            font-size: 80%;
        }
        
        .bolt-1 { top: 10px; right: 10px; }
        .bolt-2 { top: 10px; left: 10px; }
        .bolt-3 { bottom: 10px; right: 10px; }
        .bolt-4 { bottom: 10px; left: 10px; }
        
        /* Hover and Active States */
        .number-plate-button:hover {
            transform: translateY(-5px) rotateX(5deg);
            box-shadow: 
                0 15px 40px rgba(0,0,0,0.4),
                inset 0 -3px 10px rgba(0,0,0,0.2);
        }
        
        .number-plate-button:active {
            transform: translateY(0) rotateX(0);
            box-shadow: 
                0 5px 20px rgba(0,0,0,0.3),
                inset 0 -3px 10px rgba(0,0,0,0.2);
            background: linear-gradient(145deg, var(--plate-dark-yellow) 0%, var(--plate-yellow) 100%);
        }
        
        /* Animation */
        @keyframes plateClick {
            0% { transform: scale(1); }
            50% { transform: scale(0.95); }
            100% { transform: scale(1); }
        }
        
        .number-plate-button.clicked {
            animation: plateClick 0.3s ease;
        }
        
        /* Responsive Design */
        @media (max-width: 600px) {
            .number-plate-button {
                width: 250px;
                height: 125px;
            }
            
            .plate-number {
                font-size: 32px;
            }
            
            .plate-label {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <button class="number-plate-button" id="plateButton">
        <div class="bolt bolt-1"></div>
        <div class="bolt bolt-2"></div>
        <div class="bolt bolt-3"></div>
        <div class="bolt bolt-4"></div>
        
        <div class="plate-number">MH 12 AB 3456</div>
        
        <!-- <div class="plate-label">Click to Validate</div> -->
    </button>
    <button class="number-plate-button2" id="plateButton">
        <div class="bolt bolt-1"></div>
        <div class="bolt bolt-2"></div>
        <div class="bolt bolt-3"></div>
        <div class="bolt bolt-4"></div>
        
        <div class="plate-number">MH 12 AB 3856</div>
        
        <!-- <div class="plate-label">Click to Validate</div> -->
    </button>
    <button class="number-plate-button3" id="plateButton">
        <div class="bolt bolt-1"></div>
        <div class="bolt bolt-2"></div>
        <div class="bolt bolt-3"></div>
        <div class="bolt bolt-4"></div>
        
        <div class="plate-number">MH 12 AB 3556</div>
        
        <!-- <div class="plate-label">Click to Validate</div> -->
    </button>


</body>
</html>
